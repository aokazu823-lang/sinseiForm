<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>投扇興大会</title>
<style>
:root{--bg:#f5efe5;--paper:#fffdf8;--ink:#29231f;--line:#ddcfbb;--red:#963e37;--gold:#a67823}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:760px;margin:auto;padding:10px 12px 48px}h1{font-size:25px;margin:8px 0}h2{font-size:21px}
.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0 9px}
button,input{font:inherit}button{width:100%;min-height:50px;padding:10px;margin:4px 0;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:16px;font-weight:750;touch-action:manipulation}button:active{background:#eee3d4}
.nav button{margin:0;font-size:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0}.hidden{display:none}.q{font-size:21px;font-weight:850;line-height:1.4;margin:5px 0 10px}.note{font-size:13px;color:#6d6258;line-height:1.55}.badge{display:inline-block;background:#eee3d2;border-radius:99px;padding:4px 9px;font-size:12px}.primary{background:var(--red);color:white;border-color:var(--red)}.soft{background:#efe5d7}.danger{background:#fff0ed;color:#a02f2b}
input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px}.row{display:grid;grid-template-columns:1fr 100px;gap:7px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.role{min-height:190px;padding:8px}.role img{width:100%;height:125px;object-fit:contain;background:#fbf7ef;border-radius:10px}.role b{display:block;font-size:18px}.pts{font-size:18px;font-weight:900;color:var(--gold)}.neg{color:#aa3030}
.choice{display:grid;grid-template-columns:42px 1fr;text-align:left;align-items:center;gap:8px}.choice .em{font-size:27px;text-align:center}.players{display:flex;gap:6px;overflow:auto;padding:2px}.players button{min-width:105px}.active{outline:3px solid #c49339}
.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modeGrid button{min-height:90px;font-size:18px}.scoreline{padding:9px 0;border-bottom:1px solid var(--line)}.rank{font-size:20px}.bigscore{font-size:30px;font-weight:900;color:var(--red)}.progress{font-size:14px;font-weight:700;color:#6d6258}.teamBox{border:2px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}.checkrow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid #eee}.checkrow input{width:24px;min-height:24px}
@media(min-width:600px){.nav{grid-template-columns:repeat(4,1fr)}}@media(max-width:380px){.grid{grid-template-columns:1fr}.role{min-height:175px}}
</style></head><body><main>
<div class="nav"><button data-page="game">🎴 ゲーム</button><button data-page="roles">🖼️ 28銘</button><button data-page="members">👥 メンバー</button><button data-page="score">🏆 結果</button></div>

<section id="game"><h1>🎴 投扇興大会</h1><div id="gameArea"></div></section>
<section id="roles" class="hidden"><h2>🖼️ 銘一覧</h2><div class="note">アップロードしてもらったSVGをそのまま表示しています。</div><div id="roleGrid" class="grid"></div></section>
<section id="members" class="hidden"><h2>👥 メンバー</h2><div class="card"><div class="row"><input id="newName" placeholder="名前"><button id="addMember">＋追加</button></div><div id="memberList"></div></div></section>
<section id="score" class="hidden"><h2>🏆 結果・履歴</h2><div id="scoreArea"></div></section>
</main>
<script>
(function(){"use strict";
const R=[{"file": "akashi.svg", "name": "明石", "pts": 20}, {"file": "azumaya.svg", "name": "東屋", "pts": 10}, {"file": "fujibakama.svg", "name": "藤袴", "pts": 2}, {"file": "hahakigi.svg", "name": "帚木", "pts": 80}, {"file": "hanachirusato.svg", "name": "花散里", "pts": 3}, {"file": "hatsune.svg", "name": "初音", "pts": 10}, {"file": "hotaru.svg", "name": "螢", "pts": 45}, {"file": "itoyu.svg", "name": "糸遊", "pts": 15}, {"file": "kiritsubo.svg", "name": "桐壺", "pts": 50}, {"file": "kocho.svg", "name": "胡蝶", "pts": 85}, {"file": "kotsun.svg", "name": "こつん", "pts": -2}, {"file": "maboroshi.svg", "name": "幻", "pts": 20}, {"file": "miotsukushi.svg", "name": "澪標", "pts": 35}, {"file": "nowake.svg", "name": "野分", "pts": -30}, {"file": "sawarabi.svg", "name": "早蕨", "pts": 8}, {"file": "sekiya.svg", "name": "関屋", "pts": 2}, {"file": "suetsumuhana.svg", "name": "末摘花", "pts": 5}, {"file": "suma.svg", "name": "須磨", "pts": 10}, {"file": "tenarai.svg", "name": "手習", "pts": 0}, {"file": "tokonatsu.svg", "name": "常夏", "pts": 10}, {"file": "ukifune.svg", "name": "浮舟", "pts": 20}, {"file": "wakamurasaki.svg", "name": "若紫", "pts": 15}, {"file": "yadorigi.svg", "name": "宿木", "pts": 8}, {"file": "yomogiu.svg", "name": "蓬生", "pts": 35}, {"file": "yugao.svg", "name": "夕顔", "pts": 8}, {"file": "yugiri.svg", "name": "夕霧", "pts": 5}, {"file": "yume-no-ukihashi.svg", "name": "夢浮橋", "pts": 100}, {"file": "yurari.svg", "name": "ゆらり", "pts": 2}];
let players=JSON.parse(localStorage.getItem("ts_players")||"[]");
let match=JSON.parse(localStorage.getItem("ts_match")||"null");
const GA=document.getElementById("gameArea");

function save(){localStorage.setItem("ts_players",JSON.stringify(players));localStorage.setItem("ts_match",JSON.stringify(match))}
function page(id){["game","roles","members","score"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));if(id==="game")renderGame();if(id==="members")renderMembers();if(id==="score")renderScore();scrollTo(0,0)}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>page(b.dataset.page));

function renderMembers(){
 let box=document.getElementById("memberList");
 box.innerHTML=players.length?players.map((p,i)=>`<div class="scoreline"><b>${p}</b><button class="danger" data-del="${i}">削除</button></div>`).join(""):'<p class="note">まず参加者を登録してください。</p>';
 box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{players.splice(+b.dataset.del,1);save();renderMembers()});
}
document.getElementById("addMember").onclick=()=>{let i=document.getElementById("newName"),n=i.value.trim();if(n&&!players.includes(n))players.push(n);i.value="";save();renderMembers()};

function setup(){
 if(!players.length){GA.innerHTML='<div class="card"><div class="q">まずメンバー登録</div><button id="toMem">👥 メンバーを登録する</button></div>';document.getElementById("toMem").onclick=()=>page("members");return}
 GA.innerHTML=`<div class="card"><div class="q">対戦形式を選んで</div><div class="modeGrid"><button id="solo">👤 個人戦<br><span class="note">3投 / 5投</span></button><button id="team">👥 チーム戦<br><span class="note">各チーム合計8投</span></button></div></div>`;
 document.getElementById("solo").onclick=soloSetup;document.getElementById("team").onclick=teamSetup;
}
function soloSetup(){
 GA.innerHTML=`<div class="card"><div class="q">個人戦は何投？</div><div class="modeGrid"><button data-n="3">3投</button><button data-n="5">5投</button></div></div><div class="card"><div class="q">参加メンバー</div>${players.map((p,i)=>`<label class="checkrow"><input type="checkbox" class="soloP" value="${i}" checked>${p}</label>`).join("")}<button id="startSolo" class="primary">🎴 個人戦スタート</button></div>`;
 let limit=3;GA.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{limit=+b.dataset.n;GA.querySelectorAll("[data-n]").forEach(x=>x.classList.remove("active"));b.classList.add("active")});GA.querySelector('[data-n="3"]').classList.add("active");
 document.getElementById("startSolo").onclick=()=>{let ids=[...document.querySelectorAll(".soloP:checked")].map(x=>+x.value);if(!ids.length)return;match={type:"solo",limit,participants:ids.map(i=>players[i]),logs:[],turn:0,done:false};save();renderGame()};
}
function teamSetup(){
 GA.innerHTML=`<div class="card"><div class="q">チーム名</div><input id="ta" value="チームA"><input id="tb" value="チームB"></div><div class="card"><div class="q">メンバーを振り分け</div>${players.map((p,i)=>`<div class="scoreline"><b>${p}</b><div class="modeGrid"><button data-p="${i}" data-t="A">A</button><button data-p="${i}" data-t="B">B</button></div></div>`).join("")}<button id="startTeam" class="primary">🎴 チーム戦スタート</button></div>`;
 let assign={};GA.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{let i=+b.dataset.p;assign[i]=b.dataset.t;GA.querySelectorAll(`[data-p="${i}"]`).forEach(x=>x.classList.remove("active"));b.classList.add("active")});
 document.getElementById("startTeam").onclick=()=>{let A=[],B=[];Object.keys(assign).forEach(i=>{(assign[i]==="A"?A:B).push(players[+i])});if(!A.length||!B.length)return;match={type:"team",limit:8,teams:[{name:document.getElementById("ta").value||"チームA",members:A},{name:document.getElementById("tb").value||"チームB",members:B}],logs:[],teamTurn:0,selected:A[0],done:false};save();renderGame()};
}

function totals(){
 let s={};if(!match)return s;
 if(match.type==="solo")match.participants.forEach(p=>s[p]=0);else match.teams.forEach(t=>s[t.name]=0);
 match.logs.forEach(l=>{let k=match.type==="solo"?l.player:l.team;s[k]=(s[k]||0)+l.pts});return s
}
function counts(key){return match.logs.filter(l=>(match.type==="solo"?l.player:l.team)===key).length}
function renderGame(){
 if(!match||match.done){setup();return}
 if(match.type==="solo")renderSolo();else renderTeam();
}
function renderSolo(){
 let available=match.participants.filter(p=>counts(p)<match.limit);
 if(!available.length){match.done=true;save();page("score");return}
 let p=available[match.turn%available.length]; let s=totals();
 GA.innerHTML=`<div class="card"><span class="badge">個人戦 ${match.limit}投</span><div class="q">次は ${p}</div><div class="bigscore">${s[p]||0}点</div><div class="progress">${counts(p)} / ${match.limit}投</div></div><div id="judge"></div><button id="quit" class="danger">試合を終了</button>`;
 judgeUI(document.getElementById("judge"),(r)=>{match.logs.push({player:p,role:r.name,pts:r.pts});match.turn++;save();renderSolo()});
 document.getElementById("quit").onclick=endMatch;
}
function renderTeam(){
 let t=match.teams[match.teamTurn%2];if(counts(t.name)>=8){match.teamTurn++;t=match.teams[match.teamTurn%2]}
 if(match.teams.every(x=>counts(x.name)>=8)){match.done=true;save();page("score");return}
 if(!t.members.includes(match.selected))match.selected=t.members[0];let s=totals();
 GA.innerHTML=`<div class="card"><span class="badge">チーム戦 各8投</span><div class="q">${t.name}　${counts(t.name)} / 8投</div><div class="bigscore">${s[t.name]||0}点</div><div class="note">今回投げる人を選択</div><div class="players">${t.members.map(p=>`<button data-person="${p}" class="${p===match.selected?'active':''}">${p}</button>`).join("")}</div></div><div id="judge"></div><button id="quit" class="danger">試合を終了</button>`;
 GA.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>{match.selected=b.dataset.person;save();renderTeam()});
 judgeUI(document.getElementById("judge"),(r)=>{match.logs.push({team:t.name,player:match.selected,role:r.name,pts:r.pts});match.teamTurn++;save();renderTeam()});
 document.getElementById("quit").onclick=endMatch;
}
function endMatch(){match.done=true;save();page("score")}

function judgeUI(root,onPick){
 // 個人戦・チーム戦とも同じ質問形式で候補を絞り、最後にSVGを見比べて決定する。
 // 質問は「分からない」で飛ばせる。誤判定を避けるため、回答だけで1銘に断定はしない。
 const questions=[
  {q:"まず、蝶（的）は台の上に残ってる？", a:["残っている","台から落ちている","分からない"]},
  {q:"扇は台の上に乗ってる？", a:["乗っている","乗っていない","分からない"]},
  {q:"扇は蝶（的）に触れてる？", a:["触れている","触れていない","分からない"]},
  {q:"扇は床についてる？", a:["床についている","床についていない","分からない"]},
  {q:"蝶（的）は扇の上に乗ってる？", a:["乗っている","乗っていない","分からない"]}
 ];
 let qi=0, answers=[];
 function ask(){
   if(qi>=questions.length){ choose(); return; }
   const x=questions[qi];
   root.innerHTML=`<div class="card"><span class="badge">判定質問 ${qi+1} / ${questions.length}</span><div class="q">${x.q}</div>${x.a.map((v,i)=>`<button data-a="${i}">${v}</button>`).join("")}<button id="showAll" class="soft">質問をやめて28銘から選ぶ</button></div>`;
   root.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{answers.push(+b.dataset.a);qi++;ask()});
   document.getElementById("showAll").onclick=choose;
 }
 function choose(){
   root.innerHTML=`<div class="card"><div class="q">最後は画像を見比べて選んで</div><div class="note">質問の回答を参考に、実際の形とSVGが同じ銘をタップしてください。迷ったら全28銘を見比べられます。</div><div class="grid">${R.map((r,i)=>`<button class="role" data-role="${i}"><img src="img/${r.file}" alt="${r.name}"><b>${r.name}</b><span class="pts ${r.pts<0?'neg':''}">${r.pts>0?'+':''}${r.pts}点</span></button>`).join("")}</div><button id="againQ" class="soft">← 質問をやり直す</button></div>`;
   root.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>onPick(R[+b.dataset.role]));
   document.getElementById("againQ").onclick=()=>{qi=0;answers=[];ask()};
 }
 ask();
}
function renderScore(){
 let a=document.getElementById("scoreArea");if(!match){a.innerHTML='<div class="card">まだ試合がありません。</div>';return}
 let s=totals(), keys=match.type==="solo"?match.participants:match.teams.map(t=>t.name);
 let rank=keys.map(k=>[k,s[k]||0,counts(k)]).sort((x,y)=>y[1]-x[1]);
 a.innerHTML=`<div class="card"><span class="badge">${match.type==="solo"?'個人戦 '+match.limit+'投':'チーム戦 各8投'}</span>${rank.map((x,i)=>`<div class="scoreline rank"><b>${i+1}位 ${x[0]}</b>　${x[1]}点 <span class="note">(${x[2]}投)</span></div>`).join("")}</div><div class="card"><div class="q">投球履歴</div>${match.logs.slice().reverse().map(l=>`<div class="scoreline">${match.type==="team"?l.team+" / ":""}${l.player}　<b>${l.role}</b>　${l.pts>0?'+':''}${l.pts}点</div>`).join("")||"記録なし"}<button id="undo">↩️ 最後の1投を取り消す</button><button id="continue">試合に戻る</button><button id="newGame" class="primary">🆕 新しい試合</button></div>`;
 document.getElementById("undo").onclick=()=>{match.logs.pop();match.done=false;save();renderScore()};
 document.getElementById("continue").onclick=()=>{match.done=false;save();page("game")};
 document.getElementById("newGame").onclick=()=>{match=null;save();page("game")};
}

document.getElementById("roleGrid").innerHTML=R.map(r=>`<button class="role"><img src="img/${r.file}" alt="${r.name}"><b>${r.name}</b><span class="pts ${r.pts<0?'neg':''}">${r.pts>0?'+':''}${r.pts}点</span></button>`).join("");
renderMembers();renderGame();renderScore();
})();
</script></body></html>
