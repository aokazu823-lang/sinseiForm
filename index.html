<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>投扇興 判定</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f6f0e5;
  color: #29231f;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 14px 12px 50px;
}

h1 {
  font-size: 26px;
  margin: 8px 0;
}

h2 {
  font-size: 21px;
}

.description {
  font-size: 14px;
  color: #6d6258;
  line-height: 1.6;
  margin-bottom: 15px;
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 15px;
}

button {
  width: 100%;
  min-height: 58px;
  margin: 6px 0;
  padding: 12px;

  border: 1px solid #d9cbb8;
  border-radius: 14px;

  background: white;
  color: #29231f;

  font-size: 17px;
  font-weight: 700;

  cursor: pointer;
}

button:active {
  background: #eadfce;
  transform: scale(.98);
}

.menu button {
  min-height: 52px;
  font-size: 15px;
}

.card {
  background: #fffdf8;
  border: 1px solid #ddd0bd;
  border-radius: 18px;

  padding: 15px;
  margin: 12px 0;
}

.question {
  font-size: 22px;
  font-weight: 800;
  line-height: 1.45;
  margin: 10px 0 15px;
}

.option {
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon {
  font-size: 30px;
  min-width: 40px;
  text-align: center;
}

.small {
  font-size: 13px;
  color: #6c6259;
}

.badge {
  display: inline-block;

  padding: 5px 10px;
  border-radius: 20px;

  background: #eee3d2;

  font-size: 12px;
}

.hidden {
  display: none;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.roleButton {
  min-height: 85px;
}

.roleName {
  display: block;
  font-size: 19px;
  margin-bottom: 5px;
}

.points {
  font-size: 19px;
  font-weight: 900;
  color: #a47725;
}

.minus {
  color: #b23838;
}

.result {
  text-align: center;
  padding: 15px 0;
}

.resultName {
  font-size: 40px;
  font-weight: 900;
  color: #963d36;
}

.resultPoints {
  font-size: 30px;
  font-weight: 900;
  color: #a47725;
}

.reset {
  background: #eee5d8;
}

@media (max-width: 370px) {

  .grid {
    grid-template-columns: 1fr;
  }

}
</style>
</head>


<body>

<div class="container">

<h1>🎴 投扇興 判定</h1>

<div class="description">
「ぽかぽか」で使われているものと同系統の
京竹堂 投扇興点数表を参考にした判定補助アプリです。
実物を見ながら質問に答えてください。
</div>


<div class="menu">

<button id="judgeMenu">
🎯 質問で判定
</button>

<button id="listMenu">
📜 点数一覧
</button>

</div>


<section id="judgePage">

<div id="wizard" class="card"></div>

</section>


<section id="listPage" class="hidden">

<h2>📜 点数一覧</h2>

<div class="small">
銘が分かっている場合は、ここから直接選べます。
</div>

<div id="roleList" class="grid"></div>

</section>


</div>


<script>

/* =========================
   点数表
========================= */

const roles = [

["東屋",10],
["若紫",15],
["明石",20],
["蓬生",35],
["浮舟",20],
["桐壺",50],
["胡蝶",85],

["夕霧",5],
["夕顔",8],
["澪標",35],
["帚木",80],
["関屋",2],
["藤袴",2],
["早蕨",8],

["夢浮橋",100],
["常夏",10],
["初音",10],
["花散里",3],
["末摘花",5],
["宿木",8],
["須磨",10],

["こつん",-2],
["ゆらり",2],
["手習",0],
["野分",-30],
["幻",20],
["螢",45]

];


/* =========================
   画面
========================= */

const wizard =
document.getElementById("wizard");

const judgePage =
document.getElementById("judgePage");

const listPage =
document.getElementById("listPage");


document
.getElementById("judgeMenu")
.addEventListener("click", function(){

  judgePage.classList.remove("hidden");
  listPage.classList.add("hidden");

  start();

});


document
.getElementById("listMenu")
.addEventListener("click", function(){

  judgePage.classList.add("hidden");
  listPage.classList.remove("hidden");

});


/* =========================
   状態
========================= */

let state = {};


/* =========================
   質問作成
========================= */

function question(title, options) {

  wizard.innerHTML = "";

  const badge =
  document.createElement("div");

  badge.className = "badge";
  badge.textContent =
  "実物を見ながら選択";


  const q =
  document.createElement("div");

  q.className = "question";
  q.textContent = title;


  wizard.appendChild(badge);
  wizard.appendChild(q);


  options.forEach(function(option) {

    const button =
    document.createElement("button");

    button.className = "option";


    const icon =
    document.createElement("span");

    icon.className = "icon";
    icon.textContent = option.icon;


    const text =
    document.createElement("span");

    text.textContent = option.text;


    button.appendChild(icon);
    button.appendChild(text);


    button.addEventListener(
      "click",
      option.action
    );


    wizard.appendChild(button);

  });


  const reset =
  document.createElement("button");

  reset.className = "reset";

  reset.textContent =
  "↩️ 最初から";


  reset.addEventListener(
    "click",
    start
  );


  wizard.appendChild(reset);

}


/* =========================
   STEP 1
========================= */

function start() {

  state = {};

  question(
    "① 枕（木の台）はどうなった？",
    [

      {
        icon:"🧱",
        text:"立ったまま",
        action:function(){

          state.pillow="up";

          butterflyQuestion();

        }
      },

      {
        icon:"💥",
        text:"倒れた",
        action:function(){

          state.pillow="down";

          showResult(
            "野分",
            -30,
            "枕まで倒れた形。点数表の野分と見比べて確認してください。"
          );

        }
      }

    ]
  );

}


/* =========================
   STEP 2
========================= */

function butterflyQuestion() {

  question(
    "② 蝶（的）は最終的にどこ？",
    [

      {
        icon:"🦋",
        text:"地面に落ちている",
        action:function(){

          state.butterfly="ground";

          fanQuestion();

        }
      },

      {
        icon:"🎯",
        text:"枕の上・枕のすぐ近く",
        action:function(){

          state.butterfly="pillow";

          fanQuestion();

        }
      },

      {
        icon:"🪭",
        text:"扇の上・扇に重なっている",
        action:function(){

          state.butterfly="fan";

          fanQuestion();

        }
      }

    ]
  );

}


/* =========================
   STEP 3
========================= */

function fanQuestion() {

  question(
    "③ 扇は最終的にどこ？",
    [

      {
        icon:"🪭",
        text:"地面にある",
        action:function(){

          state.fan="ground";

          contactQuestion();

        }
      },

      {
        icon:"↗️",
        text:"枕にもたれている",
        action:function(){

          state.fan="lean";

          contactQuestion();

        }
      },

      {
        icon:"🔝",
        text:"枕の上に乗っている",
        action:function(){

          state.fan="pillow";

          contactQuestion();

        }
      },

      {
        icon:"🌉",
        text:"枕と蝶の間に橋のように架かっている",
        action:function(){

          state.fan="bridge";

          showResult(
            "夢浮橋",
            100,
            "最高得点の形。点数表の夢浮橋と一致するか確認してください。"
          );

        }
      }

    ]
  );

}


/* =========================
   STEP 4
========================= */

function contactQuestion() {

  question(
    "④ 扇と蝶は触れている？",
    [

      {
        icon:"⭕",
        text:"触れている・重なっている",
        action:function(){

          state.contact="yes";

          standingQuestion();

        }
      },

      {
        icon:"↔️",
        text:"離れている",
        action:function(){

          state.contact="no";

          standingQuestion();

        }
      },

      {
        icon:"🤔",
        text:"微妙で分からない",
        action:function(){

          state.contact="unknown";

          standingQuestion();

        }
      }

    ]
  );

}


/* =========================
   STEP 5
========================= */

function standingQuestion() {

  question(
    "⑤ 蝶は立っている？ 倒れている？",
    [

      {
        icon:"🦋",
        text:"立っている",
        action:function(){

          state.standing="yes";

          candidate();

        }
      },

      {
        icon:"➖",
        text:"倒れている・寝ている",
        action:function(){

          state.standing="no";

          candidate();

        }
      },

      {
        icon:"🤔",
        text:"判断しづらい",
        action:function(){

          state.standing="unknown";

          candidate();

        }
      }

    ]
  );

}


/* =========================
   候補判定
========================= */

function candidate() {

  let candidates = [];


  if (
    state.fan === "pillow" &&
    state.butterfly === "fan"
  ) {

    candidates =
    ["胡蝶","帚木"];

  }


  else if (
    state.fan === "pillow" &&
    state.butterfly === "ground"
  ) {

    candidates =
    ["桐壺","澪標"];

  }


  else if (
    state.fan === "lean"
  ) {

    candidates =
    ["関屋","幻","螢"];

  }


  else if (
    state.butterfly === "fan"
  ) {

    candidates =
    [
      "若紫",
      "浮舟",
      "夕顔",
      "常夏",
      "宿木"
    ];

  }


  else if (
    state.butterfly === "pillow"
  ) {

    candidates =
    [
      "明石",
      "藤袴",
      "初音",
      "須磨",
      "こつん",
      "ゆらり",
      "手習"
    ];

  }


  else if (
    state.butterfly === "ground" &&
    state.contact === "yes"
  ) {

    candidates =
    [
      "蓬生",
      "夕霧",
      "末摘花"
    ];

  }


  else {

    candidates =
    [
      "東屋",
      "花散里",
      "早蕨",
      "夕霧",
      "末摘花"
    ];

  }


  showCandidates(candidates);

}


/* =========================
   候補表示
========================= */

function showCandidates(names) {

  wizard.innerHTML = "";


  const badge =
  document.createElement("div");

  badge.className = "badge";

  badge.textContent =
  "候補 " + names.length + "種類";


  const title =
  document.createElement("div");

  title.className = "question";

  title.textContent =
  "点数表の絵と見比べて、一番近いものを選んで";


  wizard.appendChild(badge);
  wizard.appendChild(title);


  const grid =
  document.createElement("div");

  grid.className = "grid";


  names.forEach(function(name) {

    const role =
    roles.find(function(r) {

      return r[0] === name;

    });


    if (!role) return;


    const button =
    document.createElement("button");

    button.className =
    "roleButton";


    button.innerHTML =
      "<span class='roleName'>" +
      role[0] +
      "</span>" +

      "<span class='points " +
      (role[1] < 0 ? "minus" : "") +
      "'>" +

      (role[1] > 0 ? "+" : "") +
      role[1] +
      "点</span>";


    button.addEventListener(
      "click",
      function(){

        showResult(
          role[0],
          role[1],
          "点数表の絵と実物を見比べて最終確認してください。"
        );

      }
    );


    grid.appendChild(button);

  });


  wizard.appendChild(grid);


  const again =
  document.createElement("button");

  again.className = "reset";

  again.textContent =
  "↩️ 最初から判定";


  again.addEventListener(
    "click",
    start
  );


  wizard.appendChild(again);

}


/* =========================
   結果
========================= */

function showResult(
  name,
  points,
  text
) {

  wizard.innerHTML = "";


  const result =
  document.createElement("div");

  result.className = "result";


  const n =
  document.createElement("div");

  n.className = "resultName";

  n.textContent = name;


  const p =
  document.createElement("div");

  p.className =
  "resultPoints";

  if (points < 0) {

    p.classList.add("minus");

  }


  p.textContent =
    (points > 0 ? "+" : "") +
    points +
    "点";


  const explanation =
  document.createElement("p");

  explanation.className =
  "small";

  explanation.textContent =
  text;


  result.appendChild(n);
  result.appendChild(p);
  result.appendChild(explanation);


  wizard.appendChild(result);


  const next =
  document.createElement("button");

  next.textContent =
  "🎯 次の一投を判定";


  next.addEventListener(
    "click",
    start
  );


  wizard.appendChild(next);

}


/* =========================
   点数一覧
========================= */

const roleList =
document.getElementById("roleList");


roles.forEach(function(role) {

  const button =
  document.createElement("button");


  button.className =
  "roleButton";


  button.innerHTML =

    "<span class='roleName'>" +
    role[0] +
    "</span>" +

    "<span class='points " +
    (role[1] < 0 ? "minus" : "") +
    "'>" +

    (role[1] > 0 ? "+" : "") +

    role[1] +

    "点</span>";


  button.addEventListener(
    "click",
    function(){

      listPage.classList.add("hidden");

      judgePage.classList.remove("hidden");


      showResult(

        role[0],

        role[1],

        "点数一覧から選択しました。"

      );

    }
  );


  roleList.appendChild(button);

});


/* 最初の画面 */

start();

</script>

</body>
</html>
