<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>投扇興大会</title><style>
:root{--bg:#f5efe4;--paper:#fffdf9;--ink:#29231f;--line:#ddcfba;--red:#963d36;--gold:#a47725}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:720px;margin:auto;padding:10px 12px 50px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 9px}button,input{font:inherit}button{width:100%;min-height:52px;padding:10px;margin:5px 0;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-weight:800;font-size:16px;touch-action:manipulation}button:active{background:#eee3d3}.nav button{margin:0;font-size:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0}.hidden{display:none}.q{font-size:21px;font-weight:900;line-height:1.4;margin:7px 0 12px}.note{font-size:13px;color:#6b6158;line-height:1.55}.badge{display:inline-block;background:#eee3d2;border-radius:99px;padding:5px 10px;font-size:12px}.choice{text-align:left}.soft{background:#efe5d6}.primary{background:var(--red);color:#fff;border-color:var(--red)}.danger{background:#fff0ed;color:#9d302b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.role{padding:8px;min-height:230px}.role img{display:block;width:100%;height:165px;object-fit:contain;background:#faf7f0;border-radius:10px;margin-bottom:5px}.role b{display:block;font-size:18px}.pts{font-size:19px;font-weight:900;color:var(--gold)}.neg{color:#a83232}.players{display:flex;gap:6px;overflow:auto;padding:3px}.players button{min-width:105px}.active{outline:3px solid #c39339}.row{display:grid;grid-template-columns:1fr 95px;gap:7px}input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px}.scoreline{padding:10px 0;border-bottom:1px solid var(--line)}.rank{font-size:20px}.result{text-align:center}.result img{width:100%;max-height:340px;object-fit:contain;background:#faf7f0;border-radius:12px}.result .name{font-size:38px;font-weight:900;color:var(--red)}.result .points{font-size:28px;font-weight:900;color:var(--gold)}.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.filters button{width:auto;min-height:38px;padding:6px 10px;margin:0;font-size:13px}@media(min-width:600px){.nav{grid-template-columns:repeat(4,1fr)}}@media(max-width:380px){.grid{grid-template-columns:1fr}.role{min-height:245px}.role img{height:185px}}
</style></head><body><main><div class="nav"><button data-page="judge">🎯 判定</button><button data-page="roles">🖼️ 28銘</button><button data-page="members">👥 メンバー</button><button data-page="score">🏆 得点</button></div>
<section id="judge"><h2>🎴 投扇興 判定</h2><div id="turn" class="card"></div><div id="wizard" class="card"></div></section>
<section id="roles" class="hidden"><h2>🖼️ 28銘一覧</h2><div class="note">提供されたSVGをそのまま表示しています。銘が分かるときは直接タップして得点登録できます。</div><div id="roleGrid" class="grid"></div></section>
<section id="members" class="hidden"><h2>👥 メンバー</h2><div class="card"><div class="row"><input id="newName" placeholder="名前を入力"><button id="addBtn">＋追加</button></div><div id="memberList"></div></div></section>
<section id="score" class="hidden"><h2>🏆 得点表</h2><div class="card"><div id="ranking"></div></div><div class="card"><div class="q">履歴</div><div id="history"></div><button id="undoBtn">↩️ 直前の一投を取り消す</button><button id="resetBtn" class="danger">🗑️ 得点を全部リセット</button></div></section>
</main><script>
(()=>{"use strict";
const R=[
["東屋",10,"azumaya.svg"],["若紫",15,"wakamurasaki.svg"],["明石",20,"akashi.svg"],["蓬生",35,"yomogiu.svg"],["浮舟",20,"ukifune.svg"],["桐壺",50,"kiritsubo.svg"],["胡蝶",85,"kocho.svg"],
["夕霧",5,"yugiri.svg"],["夕顔",8,"yugao.svg"],["澪標",35,"miotsukushi.svg"],["帚木",80,"hahakigi.svg"],["関屋",2,"sekiya.svg"],["藤袴",2,"fujibakama.svg"],["早蕨",8,"sawarabi.svg"],
["夢浮橋",100,"yume-no-ukihashi.svg"],["常夏",10,"tokonatsu.svg"],["初音",10,"hatsune.svg"],["花散里",3,"hanachirusato.svg"],["末摘花",5,"suetsumuhana.svg"],["宿木",8,"yadorigi.svg"],["須磨",10,"suma.svg"],
["こつん",-2,"kotsun.svg"],["ゆらり",2,"yurari.svg"],["手習",0,"tenarai.svg"],["野分",-30,"nowake.svg"],["幻",20,"maboroshi.svg"],["螢",45,"hotaru.svg"],["糸遊",15,"itoyu.svg"]];
const img=r=>'img/'+r[2]; let players=JSON.parse(localStorage.getItem('tosen_players2')||'["かずくん"]'),logs=JSON.parse(localStorage.getItem('tosen_logs2')||'[]'),active=+(localStorage.getItem('tosen_active2')||0);if(active>=players.length)active=0;
const save=()=>{localStorage.setItem('tosen_players2',JSON.stringify(players));localStorage.setItem('tosen_logs2',JSON.stringify(logs));localStorage.setItem('tosen_active2',active)};
function page(id){['judge','roles','members','score'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='judge'){turn();start()}if(id==='members')members();if(id==='score')score();scrollTo(0,0)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));
function turn(){let e=document.getElementById('turn');if(!players.length){e.innerHTML='<b>先にメンバーを登録してね</b><button id="gm">👥 メンバー登録へ</button>';document.getElementById('gm').onclick=()=>page('members');return}e.innerHTML='<span class="badge">いま投げる人</span><div class="q">'+players[active]+'</div><div class="players">'+players.map((p,i)=>'<button data-p="'+i+'" class="'+(i===active?'active':'')+'">'+p+'</button>').join('')+'</div>';e.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{active=+b.dataset.p;save();turn()})}
let answers={};const W=document.getElementById('wizard');
function start(){answers={};ask1()}
function q(title,opts,skip){W.innerHTML='<span class="badge">質問で絞り込み</span><div class="q">'+title+'</div>';opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o[0];b.onclick=o[1];W.appendChild(b)});if(skip){let b=document.createElement('button');b.className='soft';b.textContent='🤔 分からない → 候補画像へ';b.onclick=()=>showCandidates(R);W.appendChild(b)}}
function ask1(){q('① 枕（白い台）は倒れた？',[["🧱 立っている",()=>ask2()],["💥 倒れた",()=>showCandidates(R.filter(r=>r[0]==='野分'))]],true)}
function ask2(){q('② 扇は枕に触れている？',[["⭕ 触れている・乗っている",()=>{answers.touch=true;ask3()}],["↔️ 枕から離れている",()=>{answers.touch=false;ask3()}]],true)}
function ask3(){q('③ 蝶（赤い的）はどのあたり？',[["🎯 枕の上・枕に接している",()=>showGroup('pillow')],["🪭 扇の上・扇に重なっている",()=>showGroup('fan')],["🦋 地面・離れた場所",()=>showGroup('ground')]],true)}
function showGroup(g){let names;if(g==='pillow')names=['明石','帚木','関屋','藤袴','初音','須磨','こつん','ゆらり','手習','幻'];else if(g==='fan')names=['若紫','浮舟','夕顔','常夏','宿木','胡蝶','螢','糸遊'];else names=['東屋','蓬生','桐壺','夕霧','澪標','早蕨','夢浮橋','花散里','末摘花'];let c=R.filter(r=>names.includes(r[0]));if(answers.touch===false)c=c.filter(r=>!['帚木','関屋','胡蝶','澪標','夢浮橋','こつん','幻'].includes(r[0]));showCandidates(c.length?c:R)}
function roleButton(r){let b=document.createElement('button');b.className='role';b.innerHTML='<img src="'+img(r)+'" alt="'+r[0]+'"><b>'+r[0]+'</b><span class="pts '+(r[1]<0?'neg':'')+'">'+(r[1]>0?'+':'')+r[1]+'点</span>';b.onclick=()=>result(r);return b}
function showCandidates(c){W.innerHTML='<span class="badge">候補 '+c.length+'</span><div class="q">実物と同じ画像をタップ</div><div class="note">候補に無ければ「28銘すべて表示」。画像は提供されたSVGそのものです。</div>';let g=document.createElement('div');g.className='grid';c.forEach(r=>g.appendChild(roleButton(r)));W.appendChild(g);let all=document.createElement('button');all.className='soft';all.textContent='🖼️ 28銘すべて表示';all.onclick=()=>showCandidates(R);W.appendChild(all);let re=document.createElement('button');re.textContent='↩️ 質問を最初から';re.onclick=start;W.appendChild(re)}
function result(r){W.innerHTML='<div class="result"><img src="'+img(r)+'" alt="'+r[0]+'"><div class="name">'+r[0]+'</div><div class="points '+(r[1]<0?'neg':'')+'">'+(r[1]>0?'+':'')+r[1]+'点</div></div>';let b=document.createElement('button');b.className='primary';b.textContent=players.length?'🏆 '+players[active]+' に得点登録':'👥 メンバー登録へ';b.onclick=()=>{if(!players.length){page('members');return}logs.push({p:players[active],role:r[0],pts:r[1],at:Date.now()});active=(active+1)%players.length;save();turn();start()};W.appendChild(b);let x=document.createElement('button');x.textContent='得点登録せず戻る';x.onclick=start;W.appendChild(x)}
let rg=document.getElementById('roleGrid');R.forEach(r=>rg.appendChild(roleButton(r)));
function members(){let m=document.getElementById('memberList');m.innerHTML=players.length?players.map((p,i)=>'<div class="scoreline"><b>'+p+'</b><button class="danger" data-d="'+i+'">削除</button></div>').join(''):'まだメンバーなし';m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let i=+b.dataset.d,n=players[i];players.splice(i,1);logs=logs.filter(x=>x.p!==n);if(active>=players.length)active=0;save();members()})}document.getElementById('addBtn').onclick=()=>{let e=document.getElementById('newName'),n=e.value.trim();if(!n)return;if(!players.includes(n))players.push(n);e.value='';save();members()};
function score(){let sums={};players.forEach(p=>sums[p]=0);logs.forEach(l=>sums[l.p]=(sums[l.p]||0)+l.pts);document.getElementById('ranking').innerHTML=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map((x,i)=>'<div class="scoreline rank"><b>'+(i+1)+'位 '+x[0]+'</b>　'+x[1]+'点 <span class="note">('+logs.filter(l=>l.p===x[0]).length+'投)</span></div>').join('')||'メンバー未登録';document.getElementById('history').innerHTML=logs.length?logs.slice().reverse().map(l=>'<div class="scoreline">'+l.p+'　<b>'+l.role+'</b>　'+(l.pts>0?'+':'')+l.pts+'点</div>').join(''):'まだ記録なし'}document.getElementById('undoBtn').onclick=()=>{logs.pop();save();score()};document.getElementById('resetBtn').onclick=()=>{if(confirm('得点履歴を全部消しますか？')){logs=[];save();score()}};
turn();start();members();score();
})();</script></body></html>
