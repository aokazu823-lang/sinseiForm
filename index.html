<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>投扇興大会</title>
<style>
:root{--bg:#f5efe4;--paper:#fffdf9;--ink:#28231f;--line:#ddcfba;--red:#963d36;--gold:#a57722}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:720px;margin:auto;padding:10px 12px 45px}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;position:sticky;top:0;background:var(--bg);padding:6px 0 9px;z-index:5}
button,input{font:inherit}button{width:100%;min-height:50px;padding:10px;margin:4px 0;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-weight:750;font-size:16px;touch-action:manipulation}
button:active{background:#eee3d3}.nav button{margin:0;font-size:14px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;margin:10px 0}.hidden{display:none}.q{font-size:21px;font-weight:850;line-height:1.4;margin:6px 0 12px}.note{font-size:13px;color:#6c6157;line-height:1.55}.badge{display:inline-block;background:#eee3d2;border-radius:99px;padding:4px 9px;font-size:12px}.soft{background:#efe5d6}.primary{background:var(--red);color:white;border-color:var(--red)}
.choice{text-align:left;display:grid;grid-template-columns:42px 1fr;align-items:center;gap:8px}.choice .em{font-size:27px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.role{padding:8px;min-height:180px}.role b{display:block;font-size:18px}.pts{font-size:19px;font-weight:900;color:var(--gold)}.neg{color:#aa3030}
svg{width:100%;height:105px;background:#fbf7ef;border-radius:10px;margin-bottom:4px}.result{text-align:center}.result .name{font-size:38px;font-weight:900;color:var(--red)}.result .points{font-size:27px;font-weight:900;color:var(--gold)}
input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px}.row{display:grid;grid-template-columns:1fr 100px;gap:7px}.players{display:flex;gap:6px;overflow:auto;padding:2px}.players button{min-width:110px}.active{outline:3px solid #c39339}.scoreline{padding:9px 0;border-bottom:1px solid var(--line)}.rank{font-size:20px}.danger{background:#fff0ed;color:#9d302b}
@media(min-width:600px){.nav{grid-template-columns:repeat(4,1fr)}}
@media(max-width:380px){.grid{grid-template-columns:1fr}.role{min-height:165px}}
</style></head><body><main>
<div class="nav">
<button data-page="judge">🎯 判定</button><button data-page="roles">🖼️ 27銘</button>
<button data-page="members">👥 メンバー</button><button data-page="score">🏆 得点</button>
</div>

<section id="judge"><h2>🎴 投扇興 判定</h2><div class="note">京竹堂の点数表を基準にした判定補助。実物を見て、分かる特徴を選んでください。</div><div id="turn" class="card"></div><div id="wizard" class="card"></div></section>
<section id="roles" class="hidden"><h2>🖼️ 27銘一覧</h2><div class="note">図は点数表の配置を見分けやすく描き直した模式図です。</div><div id="roleGrid" class="grid"></div></section>
<section id="members" class="hidden"><h2>👥 メンバー</h2><div class="card"><div class="row"><input id="newName" placeholder="名前を入力"><button id="addBtn">＋追加</button></div><div id="memberList"></div></div></section>
<section id="score" class="hidden"><h2>🏆 得点表</h2><div class="card"><div id="ranking"></div></div><div class="card"><div class="q">履歴</div><div id="history"></div><button id="undoBtn">↩️ 直前の一投を取り消す</button><button id="resetBtn" class="danger">🗑️ 大会の得点をリセット</button></div></section>
</main>
<script>
(function(){
"use strict";
/* name, points, pillow, butterfly, fan, touch, extra
   P: up/down  B: ground/pillow/fan  F: ground/lean/on/bridge */
const R=[
["東屋",10,"up","ground","ground","no","near"],["若紫",15,"up","fan","ground","yes","upright"],["明石",20,"up","pillow","ground","yes","through"],["蓬生",35,"up","ground","ground","yes","cover"],["浮舟",20,"up","fan","ground","yes","inside"],["桐壺",50,"up","ground","on","no","edge"],["胡蝶",85,"up","fan","on","yes","stand"],
["夕霧",5,"up","ground","ground","yes","under"],["夕顔",8,"up","fan","ground","yes","face"],["澪標",35,"up","ground","on","yes","hang"],["帚木",80,"up","pillow","on","yes","across"],["関屋",2,"up","pillow","lean","yes","top"],["藤袴",2,"up","pillow","ground","yes","leanbutterfly"],["早蕨",8,"up","ground","ground","no","far"],
["夢浮橋",100,"up","ground","bridge","yes","bridge"],["常夏",10,"up","fan","ground","yes","butterflytop"],["初音",10,"up","pillow","ground","yes","fanup"],["花散里",3,"up","ground","ground","no","separate"],["末摘花",5,"up","ground","ground","no","pillowbetween"],["宿木",8,"up","fan","ground","yes","stack"],["須磨",10,"up","pillow","ground","yes","line"],
["こつん",-2,"up","pillow","ground","yes","hit"],["ゆらり",2,"up","pillow","ground","yes","sway"],["手習",0,"up","pillow","ground","no","miss"],["野分",-30,"down","ground","ground","no","down"],["幻",20,"up","pillow","lean","yes","weight"],["螢",45,"up","fan","ground","yes","cord"]
];

function pic(r){
 let P=r[2],B=r[3],F=r[4],E=r[6], s='<svg viewBox="0 0 160 105"><line x1="6" y1="91" x2="154" y2="91" stroke="#cbbda8" stroke-width="2"/>';
 let pillow=(down)=>down?'<g transform="rotate(70 83 70)"><rect x="70" y="39" width="27" height="48" rx="2" fill="#fff" stroke="#7d7d7d" stroke-width="2"/></g>':'<rect x="70" y="39" width="27" height="48" rx="2" fill="#fff" stroke="#7d7d7d" stroke-width="2"/>';
 let fan=(x,y,rot)=>'<g transform="translate('+x+' '+y+') rotate('+rot+')"><path d="M0 0 L-34 -17 Q0 -42 34 -17 Z" fill="#c96f3e" stroke="#85513a" stroke-width="2"/><circle cx="0" cy="0" r="3" fill="#eee"/></g>';
 let bf=(x,y,rot)=>'<g transform="translate('+x+' '+y+') rotate('+rot+')"><path d="M0 0 Q-12 -10 -18 -2 Q-11 7 0 5 Q11 7 18 -2 Q12 -10 0 0" fill="#c56d3d" stroke="#85513a"/><circle cx="0" cy="6" r="3" fill="#777"/></g>';
 s+=pillow(P==="down");
 if(F==="ground")s+=fan(E==="far"?125:E==="pillowbetween"?30:40,87,E==="fanup"?-55:0);
 if(F==="lean")s+=fan(54,72,-58);
 if(F==="on")s+=fan(83,40,0);
 if(F==="bridge")s+=fan(111,53,-25);
 if(B==="ground")s+=bf(E==="far"?20:E==="pillowbetween"?132:E==="bridge"?132:125,87,E==="upright"?0:90);
 if(B==="pillow")s+=bf(E==="line"?112:84,E==="top"?30:36,E==="leanbutterfly"?45:0);
 if(B==="fan")s+=bf(F==="on"?83:40,F==="on"?21:65,E==="stand"?0:90);
 if(E==="cord")s+='<path d="M44 60 Q55 70 50 80" fill="none" stroke="#777" stroke-width="2"/>';
 return s+'</svg>';
}

let players=JSON.parse(localStorage.getItem("tosen_players")||'["かずくん"]');
let logs=JSON.parse(localStorage.getItem("tosen_logs")||"[]");
let active=+(localStorage.getItem("tosen_active")||0); if(active>=players.length)active=0;
let filters={}, qIndex=0;
const W=document.getElementById("wizard");

function save(){localStorage.setItem("tosen_players",JSON.stringify(players));localStorage.setItem("tosen_logs",JSON.stringify(logs));localStorage.setItem("tosen_active",active)}
function page(id){["judge","roles","members","score"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));if(id==="judge"){renderTurn();start()}if(id==="members")renderMembers();if(id==="score")renderScore();scrollTo(0,0)}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>page(b.dataset.page)));

function renderTurn(){let t=document.getElementById("turn");if(!players.length){t.innerHTML='<b>先にメンバーを登録してね</b><button id="goMembers">👥 メンバー登録へ</button>';document.getElementById("goMembers").onclick=()=>page("members");return}
t.innerHTML='<span class="badge">いま投げる人</span><div class="q">'+players[active]+'</div><div class="players">'+players.map((p,i)=>'<button data-i="'+i+'" class="'+(i===active?'active':'')+'">'+p+'</button>').join("")+'</div>';
t.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{active=+b.dataset.i;save();renderTurn()})}

const Q=[
["P","① 枕（台）は？",[["🧱","立っている","up"],["💥","倒れた","down"]]],
["B","② 蝶はどこ？",[["🦋","地面","ground"],["🎯","枕の上・付近","pillow"],["🪭","扇の上・重なっている","fan"]]],
["F","③ 扇はどこ？",[["🪭","地面","ground"],["↗️","枕にもたれる","lean"],["🔝","枕の上","on"],["🌉","枕と蝶に橋のように架かる","bridge"]]],
["T","④ 扇と蝶は接触してる？",[["⭕","接触・重なっている","yes"],["↔️","離れている","no"]]]
];
function start(){filters={};qIndex=0;renderQ()}
function candidates(){return R.filter(r=>(!filters.P||r[2]===filters.P)&&(!filters.B||r[3]===filters.B)&&(!filters.F||r[4]===filters.F)&&(!filters.T||r[5]===filters.T))}
function renderQ(){
 let c=candidates(); if(c.length<=4||qIndex>=Q.length){renderCandidates(c);return}
 let q=Q[qIndex];W.innerHTML='<span class="badge">残り候補 '+c.length+'</span><div class="q">'+q[1]+'</div>';
 q[2].forEach(o=>{let b=document.createElement("button");b.className="choice";b.innerHTML='<span class="em">'+o[0]+'</span><span>'+o[1]+'</span>';b.onclick=()=>{filters[q[0]]=o[2];qIndex++;renderQ()};W.appendChild(b)});
 let skip=document.createElement("button");skip.className="soft";skip.textContent="🤔 分からない → この質問を飛ばす";skip.onclick=()=>{qIndex++;renderQ()};W.appendChild(skip);
}
function renderCandidates(c){
 if(!c.length)c=R;
 W.innerHTML='<span class="badge">候補 '+c.length+'</span><div class="q">実物と同じ形の図を選んで</div><div class="note">赤茶＝扇・蝶、白い四角＝枕。最後は形を見比べて確定。</div>';
 let g=document.createElement("div");g.className="grid";c.forEach(r=>{let b=document.createElement("button");b.className="role";b.innerHTML=pic(r)+'<b>'+r[0]+'</b><span class="pts '+(r[1]<0?'neg':'')+'">'+(r[1]>0?'+':'')+r[1]+'点</span>';b.onclick=()=>result(r);g.appendChild(b)});W.appendChild(g);
 let x=document.createElement("button");x.className="soft";x.textContent="↩️ 最初から判定";x.onclick=start;W.appendChild(x);
}
function result(r){
 W.innerHTML='<div class="result">'+pic(r)+'<div class="name">'+r[0]+'</div><div class="points '+(r[1]<0?'neg':'')+'">'+(r[1]>0?'+':'')+r[1]+'点</div></div>';
 let reg=document.createElement("button");reg.className="primary";reg.textContent=players.length?'🏆 '+players[active]+' に得点登録':'👥 メンバーを登録';reg.onclick=()=>{if(!players.length){page("members");return}logs.push({p:players[active],role:r[0],pts:r[1],at:Date.now()});active=(active+1)%players.length;save();renderTurn();start()};W.appendChild(reg);
 let again=document.createElement("button");again.textContent="得点登録せず次を判定";again.onclick=start;W.appendChild(again);
}

document.getElementById("roleGrid").innerHTML=R.map((r,i)=>'<button class="role" data-r="'+i+'">'+pic(r)+'<b>'+r[0]+'</b><span class="pts '+(r[1]<0?'neg':'')+'">'+(r[1]>0?'+':'')+r[1]+'点</span></button>').join("");
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{page("judge");result(R[+b.dataset.r])});

function renderMembers(){
 let m=document.getElementById("memberList");m.innerHTML=players.length?players.map((p,i)=>'<div class="scoreline"><b>'+p+'</b><button data-del="'+i+'" class="danger">削除</button></div>').join(""):'まだメンバーなし';
 m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{let i=+b.dataset.del,n=players[i];players.splice(i,1);logs=logs.filter(x=>x.p!==n);if(active>=players.length)active=0;save();renderMembers()});
}
document.getElementById("addBtn").onclick=()=>{let i=document.getElementById("newName"),n=i.value.trim();if(!n)return;if(!players.includes(n))players.push(n);i.value="";save();renderMembers()};
function renderScore(){
 let sums={};players.forEach(p=>sums[p]=0);logs.forEach(l=>sums[l.p]=(sums[l.p]||0)+l.pts);
 document.getElementById("ranking").innerHTML=Object.entries(sums).sort((a,b)=>b[1]-a[1]).map((x,i)=>'<div class="scoreline rank"><b>'+(i+1)+'位 '+x[0]+'</b>　'+x[1]+'点 <span class="note">('+logs.filter(l=>l.p===x[0]).length+'投)</span></div>').join("")||"メンバー未登録";
 document.getElementById("history").innerHTML=logs.length?logs.slice().reverse().map(l=>'<div class="scoreline">'+l.p+'　<b>'+l.role+'</b>　'+(l.pts>0?'+':'')+l.pts+'点</div>').join(""):"まだ記録なし";
}
document.getElementById("undoBtn").onclick=()=>{logs.pop();save();renderScore()};
document.getElementById("resetBtn").onclick=()=>{if(confirm("得点履歴を全部消しますか？")){logs=[];save();renderScore()}};
renderTurn();start();renderMembers();renderScore();
})();
</script></body></html>
